server:
  error:
    include-stacktrace: always


aws:
  accessKeyId: ${AWS_ACCESS_KEY_ID}
  secretKey: ${AWS_SECRET_ACCESS_KEY}
  region: us-east-1
  sns:
    topic:
      arn: arn:aws:sns:us-east-1:532877842082:global